<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Flutter's engine inserts one at runtime if it is missing, which is a
       frame of wrong scaling on a phone. This is the scene the app is used in. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Log fuel, track maintenance, and share your garage with the people you share cars with.">

  <!-- Both themes, so the browser chrome matches the app rather than flashing
       white in front of a dark-first interface. Values from GarageTokens.bg. -->
  <meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Garage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- A shared link previewed as a blank card. The image is the Play feature
       graphic, which is already built from the app's own tokens (decision 106). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Garage">
  <meta property="og:title" content="Garage — Fuel &amp; Maintenance">
  <meta property="og:description" content="Log fuel, track maintenance, and share your garage with the people you share cars with.">
  <meta property="og:url" content="https://garage.hrva.cc/">
  <meta property="og:image" content="https://garage.hrva.cc/social-preview.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="500">
  <meta property="og:image:alt" content="Garage — a household vehicle log">
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="hr_HR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Garage — Fuel &amp; Maintenance">
  <meta name="twitter:description" content="Log fuel, track maintenance, and share your garage with the people you share cars with.">
  <meta name="twitter:image" content="https://garage.hrva.cc/social-preview.png">

  <title>Garage — Fuel &amp; Maintenance</title>
  <link rel="manifest" href="manifest.json">

  <!-- The splash: drawn by the browser before any script runs, taken away by
       flutter_bootstrap.js on Flutter's first frame. Colours are GarageTokens
       (test/ci/web_splash_test.dart holds them to it). -->
  <style>
    html, body { margin: 0; height: 100%; background: #F4F4F2; }
    #splash {
      position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #F4F4F2; color: #16181B;
      font: 600 28px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.2em;
      /* A splash that outlives the app, say under a stale cached bootstrap,
         must never stand between a tap and the page. */
      pointer-events: none;
    }
    #splash .cursor { color: #9C6300; }
    #splash .track {
      width: 160px; height: 3px; border-radius: 3px; overflow: hidden;
      background: #E2E4E6;
    }
    #splash-progress {
      width: 5%; height: 100%; background: #9C6300;
      transition: width 300ms ease-out;
    }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #0F1114; }
      #splash { color: #F2F3F0; }
      #splash .cursor { color: #FFB020; }
      #splash .track { background: #262B31; }
      #splash-progress { background: #FFB020; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div>GARAGE<span class="cursor">_</span></div>
    <div class="track"><div id="splash-progress"></div></div>
  </div>
  <noscript>
    <style>
      #splash { display: none; }
      .no-script { max-width: 40rem; margin: 0 auto; padding: 2rem; font: 1rem/1.6 system-ui, sans-serif; color: #16181B; }
      .no-script a { color: #9C6300; }
      @media (prefers-color-scheme: dark) {
        .no-script { color: #F2F3F0; }
        .no-script a { color: #FFB020; }
      }
    </style>
    <main class="no-script">
      <h1>Garage: Fuel &amp; Maintenance</h1>
      <p>Track fuel economy, vehicle costs and service reminders, on your own or in a shared garage.</p>
      <p>The web app needs JavaScript. You can still <a href="/features">explore Garage and see screenshots</a> or <a href="https://play.google.com/store/apps/details?id=cc.hrva.garage">install Garage for Android</a>.</p>
      <p lang="hr">Za web aplikaciju uključi JavaScript. <a href="/features">Pogledaj što Garage nudi</a> ili <a href="https://play.google.com/store/apps/details?id=cc.hrva.garage&amp;hl=hr">preuzmi aplikaciju za Android</a>.</p>
      <p lang="it">L’app web richiede JavaScript. <a href="/features">Scopri Garage</a> oppure <a href="https://play.google.com/store/apps/details?id=cc.hrva.garage&amp;hl=it">scarica l’app per Android</a>.</p>
    </main>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
