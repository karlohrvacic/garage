name: CI

# Every push and every pull request: the checks that decide whether the code is
# fit to deploy.
#
# The web deploy calls this workflow and waits for it (`workflow_call` below),
# so garage.hrva.cc cannot go out over a red suite. That gate was deliberately
# absent at first, on the grounds that a household's app going out a minute
# earlier mattered more than blocking it. The trade flipped once the web build
# became the place backend problems surface first, and once people other than
# the author started using it.
#
# `flutter build web` runs here only for pull requests: on a push to main the
# deploy workflow compiles the same thing a minute later, and building it twice
# buys nothing. The Android build runs on both, because nothing else compiles
# Android until a release tag, and a break there would otherwise stay hidden
# until the worst possible moment.

# No `push` trigger: on main these checks run as the first job of the web
# deploy, which calls this workflow. Keeping both would run them twice per
# push, and with cancel-in-progress on a shared concurrency group the second
# run could cancel the deploy's own checks and fail the release.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated localizations are checked in; a mismatch means someone edited
      # an ARB without regenerating, and the app would ship the old strings.
      - name: Localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/ || {
            echo "::error::lib/l10n is stale — run 'flutter gen-l10n' and commit the result"
            exit 1
          }

      - name: Formatted
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyzed
        run: flutter analyze

      - name: Tested
        run: flutter test --coverage

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Most of this job's time went on downloading the NDK and CMake again on
      # every run. Caching Gradle's home keeps them between runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      # Compiles for a real target. Tests compile per-file and would not catch
      # something that only breaks a release build. No secrets: the app reads
      # its Supabase config from dart-defines, and an unconfigured build is
      # still a valid compile.
      # Skipped on main, where the deploy workflow compiles the same thing a
      # minute later. `github.event_name` is the caller's event, so this is
      # false when the deploy calls us.
      - name: Web release build
        if: github.event_name == 'pull_request'
        run: flutter build web --release

      # One ABI, not three. This step exists to prove the Android toolchain
      # still assembles the app (Gradle, manifest, plugins, native bits), and
      # the second and third architectures re-prove nothing. The release build
      # in deploy-play.yml compiles all of them before it uploads anything.
      - name: Android debug build
        run: flutter build apk --debug --target-platform android-arm64
