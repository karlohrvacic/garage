name: Deploy edge functions

# The four Deno functions, deployed on a push to main that touches them.
#
# They were the one part of the system that shipped by hand. Migrations apply
# themselves through the Supabase GitHub integration and the web app deploys
# itself from this repository, so a function was the only artefact whose
# deployed version could silently be older than the code that CI had just gone
# green on — and the failure is invisible: the old function keeps answering,
# correctly, with last month's behaviour.
#
# Deliberately *not* run on every push. A deploy restarts the function, and
# there is nothing to gain from restarting `push-due-reminders` because a
# Dart file changed.
#
# One-time setup, in GitHub → repo → Settings → Secrets and variables →
# Actions → Secrets:
#   SUPABASE_ACCESS_TOKEN  = a personal access token from
#                            supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   = the project ref (the <ref> in <ref>.supabase.co)
#
# Until both exist this workflow deploys nothing and says so, rather than
# failing: a fork, or a clone before the account work is done, should not have
# a permanently red tab over an account it does not have.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The same three checks CI runs, repeated here rather than depended on.
      # This workflow can be dispatched by hand, and a deploy that skipped the
      # type check would put a 500 in front of a cron nobody is watching —
      # `deno check` is the only thing that compiles these files at all.
      - name: Type-checked, linted, tested
        working-directory: supabase/functions
        run: |
          deno check **/*.ts
          deno lint
          deno test --allow-env

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is "\
                 "unset — skipping. Add both to deploy functions automatically."
            exit 0
          fi
          # Named, not globbed: `_test` is a shared fake and not a function,
          # and a directory added later should be a decision rather than a
          # silent deploy.
          for fn in public-api dispatch-webhooks delete-account push-due-reminders; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
