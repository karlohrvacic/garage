name: Deploy web

# Builds the Flutter web app in CI and deploys it to the Cloudflare Worker
# ("garage", static assets per wrangler.jsonc) on every push to main.
#
# Flutter builds here (GitHub Actions) rather than in Cloudflare's build image:
# the Cloudflare builders proved too slow for `flutter build web` (hit the
# 20-minute build timeout). Only the finished build/web is handed to Cloudflare.
#
# One-time setup:
#   1. Cloudflare → My Profile → API Tokens → Create Token →
#        template "Edit Cloudflare Workers". Copy the token.
#      Account ID is on the Workers & Pages overview page (right sidebar).
#   2. GitHub → repo → Settings → Secrets and variables → Actions → Secrets:
#        CLOUDFLARE_API_TOKEN   = <the token>
#        CLOUDFLARE_ACCOUNT_ID  = <your account id>
#        SUPABASE_URL           = https://<ref>.supabase.co
#        SUPABASE_ANON_KEY      = <the anon / publishable key>
#        GOOGLE_WEB_CLIENT_ID   = the web OAuth client id, which is what turns
#                                 on Google sign-in; leave the secret unset and
#                                 the button hides itself, email + password only
#   3. In the Cloudflare Worker ("garage") → Settings → Build, DISCONNECT the
#      Git integration so Cloudflare stops running its own (timing-out) builds.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let a newer deploy cancel an in-progress one.
concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  # The checks run first and this waits for them: a red suite must not reach
  # garage.hrva.cc, which is the live product and the first place a backend
  # mistake shows up.
  checks:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build number is the commit count; see deploy-play.yml.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Work out the version
        id: version
        run: |
          # No tag on a push to main, so the marketing version comes from
          # pubspec here. Play takes it from the tag; see deploy-play.yml.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build web --release --wasm --no-web-resources-cdn \
            --base-href "/" \
            --build-number="${{ steps.version.outputs.code }}" \
            --build-name="${{ steps.version.outputs.name }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=BUILD_NUMBER="${{ steps.version.outputs.code }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.name }}"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cut the web fonts to the characters the app uses
        run: |
          pip install fonttools==4.60.2 brotli==1.1.0
          bash scripts/subset_web_fonts.sh

      # Before the deploy, so a build over scripts/web_budget.json never goes
      # out (decision 189). The Brotli module is the font step's install.
      - name: The first download is within its budget
        run: python3 scripts/web_budget.py build/web

      # `_headers` is what isolates the site. Flutter copies web/ into the
      # build, but nothing else would notice if it stopped.
      - name: The headers file reached the build
        run: test -f build/web/_headers

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default wrangler (3.x) predates assets-only Workers
          # and fails with "Missing entry-point"; pin a 4.x wrangler.
          wranglerVersion: "4.114.0"
          command: deploy

      - name: Check the live site
        run: bash scripts/check_live_web.sh
