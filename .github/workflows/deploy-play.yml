name: Deploy to Play

# Builds the signed app bundle and uploads it to Google Play.
#
# Deliberately NOT on every push to main, unlike the web deploy: Play refuses a
# build number it has seen before, so an upload per commit would burn the
# sequence and fail. A release is a decision, made by pushing a tag.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# The tag IS the version. It carries the marketing version only, no build
# number: the job uses the commit count for that, which always goes up and can
# never repeat one Play has taken. Nothing needs editing before a release, and
# `pubspec.yaml` is only the fallback for a local build.
#
# Which track it lands on:
# The tag chooses the track:
#
#   v1.3.1              alpha, the closed test. The only track that counts
#                       toward the 12-testers-for-14-days requirement standing
#                       between this app and production access, so it is what a
#                       bare version tag means.
#   v1.3.1-internal     instant, no review, your own devices. Advances nothing
#                       toward that requirement.
#   v1.3.1-beta         open testing.
#   v1.3.1-production   once production access is granted.
#
# An unrecognised suffix fails the job rather than guessing, because guessing
# here means shipping to the wrong audience.
#
# One-time setup:
#   1. Play Console → Users and permissions → Invite user → a service account
#      (create it in Google Cloud → IAM → Service accounts, then grant it
#      "Release apps to testing tracks" and "Release to production").
#      Download its JSON key.
#   2. Encode the upload keystore:
#        base64 -i ~/garage-upload.jks | pbcopy
#   3. GitHub → Settings → Secrets and variables → Actions → Secrets:
#        PLAY_SERVICE_ACCOUNT_JSON  = the whole service-account JSON
#        ANDROID_KEYSTORE_BASE64    = the base64 from step 2
#        ANDROID_KEYSTORE_PASSWORD  = its store password
#        ANDROID_KEY_PASSWORD       = the key password (often the same)
#        ANDROID_KEY_ALIAS          = upload
#      SUPABASE_URL, SUPABASE_ANON_KEY and GOOGLE_WEB_CLIENT_ID are already set
#      for the web deploy and are reused here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        required: true
        default: alpha
        type: choice
        options: [alpha, internal, beta, production]

# `gh release create` writes to the repo; nothing else here needs write access.
permissions:
  contents: write

concurrency:
  group: play-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number is the commit count, so the whole history has to
          # be here — a shallow clone would count 1 and go backwards.
          fetch-depth: 0

      # Fail before spending a build on something that cannot be released.
      - name: Secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without it the"
            echo "::error::build falls back to debug signing and Play rejects it."
            exit 1
          fi
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set."
            exit 1
          fi

      # Versioning is not hand-maintained, and nothing about it is typed
      # twice. The tag supplies the marketing version, the commit count
      # supplies the build number, and both are passed into the build. A
      # release therefore cannot call itself something its tag does not say,
      # which used to be possible and once stopped a release at the guard that
      # noticed.
      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            raw="${GITHUB_REF_NAME#v}"
            # The tag carries the track as a suffix, so choosing where a
            # release lands is part of naming it rather than a separate trip to
            # the Actions tab. A bare tag means alpha: the closed test is the
            # common case and the only track that advances production access.
            name="${raw%%-*}"
            case "${raw#"$name"}" in
              "")            track=alpha ;;
              -internal)     track=internal ;;
              -beta)         track=beta ;;
              -production)   track=production ;;
              *)
                echo "::error::tag $GITHUB_REF_NAME has an unknown track suffix."
                echo "::error::Use v$name, or v$name-internal, -beta, -production."
                exit 1
                ;;
            esac
          else
            # A manual run picks its track from the dropdown and has no tag, so
            # the version falls back to pubspec.
            name=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            track=""
          fi
          code=$(git rev-list --count HEAD)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "Releasing $name ($code) to ${track:-the chosen track}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      # The release build pays the same NDK and CMake download the checks job
      # did, and it is the larger half of this workflow's runtime.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      # A release that skips the tests is a release nobody checked.
      - run: flutter analyze
      - run: flutter test

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          PROPS

      - name: Build the app bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=BUILD_NUMBER="${{ steps.version.outputs.code }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.name }}"

      # Proves the bundle carries the upload key rather than the debug one,
      # before Play is the thing that tells us.
      - name: Bundle is signed with the upload key
        run: |
          fingerprint=$(keytool -printcert -jarfile \
            build/app/outputs/bundle/release/app-release.aab \
            | grep 'SHA1:' | head -1)
          echo "$fingerprint"
          if echo "$fingerprint" | grep -qi 'Android Debug'; then
            echo "::error::bundle is debug-signed"
            exit 1
          fi

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cc.hrva.garage
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # `tracks`, not `track`: the singular form is deprecated in the
          # action and warns on every run.
          tracks: ${{ github.event.inputs.track || steps.version.outputs.track }}
          status: completed
          # Release notes live in the repo and are reviewed with the code that
          # they describe, instead of being pasted into the Console at 1am.
          whatsNewDirectory: distribution/whatsnew
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          # AGP nests these under the task name; the shorter path warned
          # "Unable to find debugSymbols" and uploaded without them, which
          # costs symbolicated native crash reports.
          debugSymbols: build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib

      # The same notes that went to Play, kept where the code lives.
      - name: Record the release on GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --notes-file distribution/whatsnew/whatsnew-en-GB \
            || echo "::warning::release already exists, leaving it as it is"

      - name: Forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
